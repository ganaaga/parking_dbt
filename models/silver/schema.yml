version: 2
models:
  - name: slv_ticket
    description: Cleaned, deduplicated parking tickets (1 row per ticket)
    columns:
      - name: ticket_id
        data_tests: [unique, not_null]
      - name: park_code
        data_tests: [not_null]
      - name: ticket_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['IN_PARKING', 'PAID', 'FREE_EXIT', 'UNPAID_EXIT']
